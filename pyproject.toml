[project]
name = "c5r-sim-inference"
version = "0.1.0"
description = "PyTorch client SDK for the C5R simulation Flight server"
readme = "README.md"
authors = [
    { name = "Tony Francis", email = "tony@dream3d.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pyarrow>=24.0.0",
    "torch",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
